<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Soul Music Live Engine V8</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main id="viewport">
    <section id="stage">

      <canvas id="ambientCanvas"></canvas>
      <canvas id="visualizerCanvas"></canvas>
      <canvas id="effectsCanvas"></canvas>

      <div id="leftFrame" class="reactive-frame">
        <div class="frame-inner"></div>
      </div>

      <div id="logoArea">
        <img
          id="soulLogo"
          src="assets/logo.png"
          alt="Soul Music"
        >
      </div>

      <div id="tiktokButton" class="round-button">
        <div class="tiktok-symbol">♪</div>
        <div class="button-label">TikTok</div>
      </div>

      <div id="liveButton" class="round-button">
        <div class="live-label">LIVE</div>
        <div class="live-dot"></div>
      </div>

      <div id="cameraFrame" class="reactive-frame">
        <div class="frame-inner"></div>
        <div class="frame-title">CAMERA LIVE</div>
      </div>

      <div id="ticker">
        <div id="tickerTrack"></div>
      </div>

    </section>
  </main>

  <aside id="controlPanel">
    <h2>SOUL MUSIC — AUDIO CONTROL V8</h2>

    <div class="control-row">
      <select id="musicDevice">
        <option>Încarc dispozitivele...</option>
      </select>
      <button id="activateMusic">Activează muzica</button>
    </div>

    <div class="control-row">
      <select id="voiceDevice">
        <option>Încarc dispozitivele...</option>
      </select>
      <button id="activateVoice">Activează microfonul</button>
    </div>

    <div class="slider-grid">
      <label>
        Sensibilitate muzică
        <input
          id="musicSensitivity"
          type="range"
          min="1"
          max="8"
          step="0.1"
          value="4.2"
        >
      </label>

      <label>
        Sensibilitate voce
        <input
          id="voiceSensitivity"
          type="range"
          min="1"
          max="10"
          step="0.1"
          value="5.8"
        >
      </label>
    </div>

    <button id="hidePanel">Ascunde panoul</button>

    <p id="statusText">
      Pentru muzică selectează CABLE Output, iar pentru voce microfonul real.
    </p>
  </aside>

  <div id="shortcutNotice"></div>

  <script src="audio.js"></script>
  <script src="visualizer.js"></script>
  <script src="effects.js"></script>
  <script src="banner.js"></script>
  <script src="engine.js"></script>
</body>
</html>
