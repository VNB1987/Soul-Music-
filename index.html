<div id="p"><h2>SOUL MUSIC — AUDIO CONTROL</h2>
<div class="r"><select id="ms"></select><button id="mb">Activează muzica</button></div>
<div class="r"><select id="vs"></select><button id="vb">Activează microfonul</button></div>
<button id="h">Ascunde panoul</button><p id="st">Alege CABLE Output pentru muzică și microfonul real pentru voce.</p></div>
<script>
const c=document.getElementById('fx'),x=c.getContext('2d');let W,H,D;function rs(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',rs);rs();
let ma,va,md,vd,ml=0,vl=0;
async function devices(){let t=await navigator.mediaDevices.getUserMedia({audio:true});t.getTracks().forEach(q=>q.stop());let ds=(await navigator.mediaDevices.enumerateDevices()).filter(q=>q.kind==='audioinput');for(const id of ['ms','vs']){let e=document.getElementById(id);e.innerHTML='';ds.forEach((d,i)=>{let o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||'Audio '+(i+1);e.appendChild(o)})}let m=[...ms.options].find(o=>/CABLE Output/i.test(o.textContent));if(m)ms.value=m.value;let v=[...vs.options].find(o=>/S6|Webcam|Microphone/i.test(o.textContent)&&!/Steam|CABLE/i.test(o.textContent));if(v)vs.value=v.value}
async function start(kind){let sel=kind==='m'?ms:vs,s=await navigator.mediaDevices.getUserMedia({audio:{deviceId:{exact:sel.value},echoCancellation:false,noiseSuppression:false,autoGainControl:false}}),ac=new AudioContext(),src=ac.createMediaStreamSource(s),a=ac.createAnalyser();a.fftSize=256;a.smoothingTimeConstant=.82;src.connect(a);if(kind==='m'){ma=a;md=new Uint8Array(a.frequencyBinCount)}else{va=a;vd=new Uint8Array(a.frequencyBinCount)}}
mb.onclick=()=>start('m');vb.onclick=()=>start('v');h.onclick=()=>p.style.display='none';addEventListener('keydown',e=>{if(e.key.toLowerCase()==='c')p.style.display=p.style.display==='none'?'block':'none'});
function lev(a,d){if(!a)return 0;a.getByteFrequencyData(d);let s=0;for(let i=2;i<d.length*.8;i++)s+=d[i];return s/(d.length*.8-2)/255}
function dr(t){x.clearRect(0,0,W,H);ml+=(lev(ma,md)-ml)*.2;vl+=(lev(va,vd)-vl)*.28;let m=Math.min(1,ml*3.2),v=Math.min(1,vl*4.5),hue=(t*.05)%360,cx=W*.505,cy=H*.365,R=Math.min(W,H)*.29;
for(let i=0;i<160;i++){let a=i/160*Math.PI*2-Math.PI/2,f=md?md[i%md.length]/255:.2,len=6+(15+58*f)*(.2+m),r=R;x.beginPath();x.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);x.lineTo(cx+Math.cos(a)*(r+len),cy+Math.sin(a)*(r+len));x.lineWidth=1.4+m*3;x.strokeStyle=`hsla(${(hue+i*2.25)%360},100%,66%,${.25+m*.7})`;x.shadowColor=x.strokeStyle;x.shadowBlur=8+m*24;x.stroke()}x.shadowBlur=0;
logo.style.transform=`scale(${1+m*.035})`;logo.style.opacity=.35+m*.65;cam.style.transform=`scale(${1+v*.025})`;cam.style.opacity=.35+v*.65;live.style.transform=`scale(${1+v*.04})`;live.style.opacity=.4+v*.6;requestAnimationFrame(dr)}requestAnimationFrame(dr);devices();
