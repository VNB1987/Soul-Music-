  <canvas id="fx"></canvas>
  <div id="flash"></div>
  <div id="vignette"></div>
</div>
<script>
const c=document.getElementById('fx'),x=c.getContext('2d');
let W,H,dpr;
function size(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',size);size();

const sparks=Array.from({length:130},()=>({
 a:Math.random()*Math.PI*2,
 r:.18+Math.random()*.36,
 s:.0004+Math.random()*.0018,
 z:.5+Math.random()*2.4,
 p:Math.random()*Math.PI*2
}));

function beat(t){
 const kick=Math.pow(Math.max(0,Math.sin(t*.0078)),10);
 const pulse=.45+.22*Math.sin(t*.0032)+.12*Math.sin(t*.011);
 return Math.min(1,pulse+kick*.6);
}

function draw(t){
 x.clearRect(0,0,W,H);
 const cx=W/2,cy=H/2;
 const R=Math.min(W,H)*.36;
 const b=beat(t);
 const hue=(t*.052)%360;

 // moving halo
 const g=x.createRadialGradient(cx,cy,R*.3,cx,cy,R*1.35);
 g.addColorStop(0,'rgba(0,0,0,0)');
 g.addColorStop(.68,`hsla(${hue},100%,58%,${.04+b*.08})`);
 g.addColorStop(1,'rgba(0,0,0,0)');
 x.fillStyle=g;x.fillRect(0,0,W,H);

 // Circular audio bars
 const bars=170;
 for(let i=0;i<bars;i++){
   const a=i/bars*Math.PI*2-Math.PI/2;
   const wave=.5+.5*Math.sin(i*.47+t*.0065)+.25*Math.sin(i*.19-t*.004);
   const len=8+(22+58*wave)*(0.45+b*.8);
   const rr=R*(.93+.018*Math.sin(i*.2+t*.003));
   const x1=cx+Math.cos(a)*rr,y1=cy+Math.sin(a)*rr;
   const x2=cx+Math.cos(a)*(rr+len),y2=cy+Math.sin(a)*(rr+len);
   x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);
   x.lineWidth=1.8+b*2.6;
   x.strokeStyle=`hsla(${(hue+i*2.25)%360},100%,65%,${.5+b*.45})`;
   x.shadowColor=x.strokeStyle;x.shadowBlur=8+b*22;x.stroke();
 }
 x.shadowBlur=0;

 // concentric pulse rings
 for(let k=0;k<4;k++){
   const rr=R*(.86+k*.045)+b*(3+k*3);
   x.beginPath();x.arc(cx,cy,rr,0,Math.PI*2);
   x.lineWidth=k===0?4:1.5;
   x.strokeStyle=`hsla(${(hue+k*72)%360},100%,64%,${.18+b*.34})`;
   x.shadowColor=x.strokeStyle;x.shadowBlur=12+b*18;x.stroke();
 }
 x.shadowBlur=0;

 // sparks
 for(const s of sparks){
   s.a+=s.s*(10+b*38);
   const rr=Math.min(W,H)*(s.r+.018*Math.sin(t*.003+s.p));
   const px=cx+Math.cos(s.a)*rr*1.55;
   const py=cy+Math.sin(s.a)*rr*.9;
   const rad=s.z*(.7+b*1.8);
   x.beginPath();x.arc(px,py,rad,0,Math.PI*2);
   x.fillStyle=`hsla(${(hue+s.a*50)%360},100%,72%,${.25+b*.65})`;
   x.shadowColor=x.fillStyle;x.shadowBlur=8+b*20;x.fill();
 }
 x.shadowBlur=0;

 // horizontal waveform
 x.beginPath();
 for(let i=0;i<=220;i++){
   const px=i/220*W;
   const amp=(10+35*b)*(Math.sin(i*.53+t*.01)*.55+Math.sin(i*.17-t*.006)*.45);
   const py=cy+amp*Math.sin(Math.PI*i/220);
   i?x.lineTo(px,py):x.moveTo(px,py);
 }
 x.lineWidth=2+b*2;
 x.strokeStyle=`hsla(${(hue+160)%360},100%,68%,${.35+b*.5})`;
 x.shadowColor=x.strokeStyle;x.shadowBlur=14+b*20;x.stroke();
 x.shadowBlur=0;

 document.getElementById('flash').style.background=
   `radial-gradient(circle at center, hsla(${hue},100%,60%,${b*.10}), transparent 55%)`;

 requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
