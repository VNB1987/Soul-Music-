<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Soul Music Live Engine V8</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Fereastra care adaptează scena la ecran -->
  <main id="viewport">

    <!-- Scenă fixă Full HD: 1920 × 1080 -->
    <section id="stage">

      <!-- Fundal, particule și efecte ambientale -->
      <canvas id="ambientCanvas"></canvas>

      <!-- Orga principală care va ieși din logo -->
      <canvas id="visualizerCanvas"></canvas>

      <!-- Neon, raze, explozii și efecte speciale -->
      <canvas id="effectsCanvas"></canvas>


      <!-- Dreptunghiul vertical din stânga -->
      <!-- Va rămâne de sus până jos -->
      <section
        id="leftFrame"
        class="reactive-frame"
        aria-label="Fereastră verticală"
      >
        <div class="frame-background"></div>
        <div class="frame-neon"></div>
      </section>


      <!-- Zona centrală a logo-ului -->
      <!-- Fără pătrat și fără cerc în spate -->
      <section id="logoArea">

        <div id="logoHalo"></div>

        <img
          id="soulLogo"
          src="assets/logo.png"
          alt="Soul Music"
        >

        <div id="logoEnergy"></div>

      </section>


      <!-- Buton TikTok -->
      <section
        id="tiktokButton"
        class="round-button reactive-button"
        aria-label="TikTok"
      >
        <div class="button-neon"></div>

        <div class="tiktok-symbol">♪</div>

        <div class="button-label">
          TikTok
        </div>
      </section>


      <!-- Buton LIVE -->
      <section
        id="liveButton"
        class="round-button reactive-button"
        aria-label="LIVE"
      >
        <div class="button-neon"></div>

        <div class="live-label">
          LIVE
        </div>

        <div class="live-dot"></div>
      </section>


      <!-- Fereastra mare pentru cameră -->
      <section
        id="cameraFrame"
        class="reactive-frame"
        aria-label="Camera live"
      >
        <div class="frame-background"></div>
        <div class="frame-neon"></div>

        <div class="frame-title">
          CAMERA LIVE
        </div>
      </section>


      <!-- Banner unic la baza imaginii -->
      <section
        id="ticker"
        aria-label="Mesaje Soul Music"
      >
        <div id="tickerGlow"></div>

        <div id="tickerViewport">
          <div id="tickerTrack"></div>
        </div>
      </section>

    </section>
  </main>


  <!-- Panoul pentru muzică și microfon -->
  <aside id="controlPanel">

    <h2>
      SOUL MUSIC — AUDIO CONTROL V8
    </h2>

    <div class="control-row">

      <select
        id="musicDevice"
        aria-label="Dispozitiv pentru muzică"
      >
        <option>
          Încarc dispozitivele audio...
        </option>
      </select>

      <button
        id="activateMusic"
        type="button"
      >
        Activează muzica
      </button>

    </div>


    <div class="control-row">

      <select
        id="voiceDevice"
        aria-label="Microfon"
      >
        <option>
          Încarc microfoanele...
        </option>
      </select>

      <button
        id="activateVoice"
        type="button"
      >
        Activează microfonul
      </button>

    </div>


    <div class="slider-grid">

      <label for="musicSensitivity">
        Sensibilitate muzică

        <input
          id="musicSensitivity"
          type="range"
          min="1"
          max="10"
          step="0.1"
          value="4.5"
        >
      </label>


      <label for="voiceSensitivity">
        Sensibilitate voce

        <input
          id="voiceSensitivity"
          type="range"
          min="1"
          max="12"
          step="0.1"
          value="6"
        >
      </label>


      <label for="bassSensitivity">
        Intensitate bass

        <input
          id="bassSensitivity"
          type="range"
          min="0.5"
          max="4"
          step="0.1"
          value="2"
        >
      </label>


      <label for="neonIntensity">
        Intensitate neon

        <input
          id="neonIntensity"
          type="range"
          min="0.5"
          max="3"
          step="0.1"
          value="1.6"
        >
      </label>

    </div>


    <div class="panel-buttons">

      <button
        id="calmMode"
        type="button"
      >
        Calm
      </button>

      <button
        id="partyMode"
        type="button"
      >
        Party
      </button>

      <button
        id="hidePanel"
        type="button"
      >
        Ascunde panoul
      </button>

    </div>


    <p id="statusText">
      Pentru muzică selectează CABLE Output,
      iar pentru voce selectează microfonul real.
    </p>

    <p class="shortcut-help">
      C = panou • F = fullscreen • L = blocare
    </p>

  </aside>


  <!-- Mesaj temporar pentru comenzi -->
  <div id="shortcutNotice"></div>


  <!-- Modulele Engine V8 -->
  <script src="audio.js"></script>
<script src="visualizer.js"></script>
<script src="effects.js"></script>
<script src="banner.js"></script>
<script src="engine.js"></script>

</body>
</html>
