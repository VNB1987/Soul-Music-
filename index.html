<script>
const c=document.getElementById('fx'),x=c.getContext('2d');let W,H,D;
function rs(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',rs);rs();
const stars=Array.from({length:100},()=>({x:Math.random(),y:Math.random(),r:.5+Math.random()*2,p:Math.random()*6.28}));
function beat(t){let k=Math.pow(Math.max(0,Math.sin(t*.009)),12);return Math.min(1,.32+.18*Math.sin(t*.0037)+.12*Math.sin(t*.011)+k*.75)}
function draw(t){x.clearRect(0,0,W,H);let b=beat(t),h=(t*.055)%360,cx=W*.505,cy=H*.367,R=Math.min(W,H)*.295;
for(let i=0;i<150;i++){let a=i/150*Math.PI*2-Math.PI/2,w=.55+.45*Math.sin(i*.43+t*.006)+.2*Math.sin(i*.13-t*.003),len=5+(16+48*w)*(.4+b*.9),r=R*(.98+.015*Math.sin(i*.2+t*.0025));x.beginPath();x.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);x.lineTo(cx+Math.cos(a)*(r+len),cy+Math.sin(a)*(r+len));x.lineWidth=1.5+b*2.2;x.strokeStyle=`hsla(${(h+i*2.3)%360},100%,64%,${.35+b*.55})`;x.shadowColor=x.strokeStyle;x.shadowBlur=8+b*18;x.stroke()}
x.shadowBlur=0;x.beginPath();for(let i=0;i<=240;i++){let px=i/240*W,e=Math.sin(Math.PI*i/240),py=H*.874+e*(10+26*b)*(Math.sin(i*.37+t*.012)*.55+Math.sin(i*.15-t*.008)*.45);i?x.lineTo(px,py):x.moveTo(px,py)}x.lineWidth=2.2+b*2.3;x.strokeStyle=`hsla(${(h+110)%360},100%,68%,${.35+b*.55})`;x.shadowColor=x.strokeStyle;x.shadowBlur=14+b*18;x.stroke();x.shadowBlur=0;
for(const s of stars){let a=.18+.55*(.5+.5*Math.sin(t*.001+s.p));x.beginPath();x.arc(s.x*W,s.y*H,s.r*(.7+b*.8),0,6.28);x.fillStyle=`hsla(${(h+s.x*220)%360},100%,74%,${a})`;x.fill()}requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script>
