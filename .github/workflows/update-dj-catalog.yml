name: Update DJ Soul catalog

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate latest catalog
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python dj-soul/update_catalog.py

      - name: Commit catalog when changed
        run: |
          git config user.name "Soul Music Catalog Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A dj-soul/
          if git diff --cached --quiet; then
            echo "Catalog unchanged"
            exit 0
          fi
          git commit -m "Auto-update DJ Soul catalog"
          git push
